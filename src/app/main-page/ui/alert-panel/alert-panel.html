<div class="max-w-132 flex flex-wrap" [class.hidden]="alertedBiddings().length == 0">
  @for (bidding of alertedBiddings(); track $index) {
    <div class="p-2 rounded-2xl shadow-sm bg-gray-100 m-2">
      <p class="text-lg font-bold p-2">
        Alert {{ bidding.biddingValue }} <span [class]="bidding.color">{{ bidding.suit }}</span>
      </p>
      <p class="px-2 pb-2">{{ bidding.alertInfo }}</p>
    </div>
  }
</div>
