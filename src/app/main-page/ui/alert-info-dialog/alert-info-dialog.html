<h2 mat-dialog-title>
  Alert {{ data.biddingValue }} <span [class]="data.denomination">{{ data.symbol }}</span>
</h2>
<mat-dialog-content>
  <mat-form-field class="w-md">
    <mat-label>Wyjaśnienie</mat-label>
    <textarea matInput data-testid="alert-input" [(ngModel)]="alertInfo"></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton data-testid="alert-cancel" (click)="onNoClick()">Anuluj</button>
  <button
    matButton="filled"
    data-testid="alert-confirm"
    [mat-dialog-close]="alertInfo()"
    cdkFocusInitial
  >
    Ok
  </button>
</mat-dialog-actions>
