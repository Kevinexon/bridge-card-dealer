<div
  [id]="binId"
  data-testid="bin"
  class="max-w-132 min-h-32 p-2 rounded-2xl border-2 border-dashed border-gray-400 bg-gray-50"
  cdkDropList
  [cdkDropListData]="sortedBinnedCards()"
  cdkDropListOrientation="horizontal"
  cdkDropListSortingDisabled
  [cdkDropListConnectedTo]="hands"
  (cdkDropListDropped)="drop($event)"
>
  <div class="flex items-center text-xl text-gray-600 pb-2">
    <mat-icon class="mr-2">delete</mat-icon>
    Kosz ({{ binnedCards().length }})
  </div>

  <div class="flex flex-wrap pl-10">
    @for (item of sortedBinnedCards(); track item.imgUrl) {
      <img
        [src]="item.imgUrl"
        [alt]="item.suit + ' ' + item.name"
        [attr.data-testid]="'card-' + item.suit + '-' + item.name"
        class="h-24 w-16 -ml-10 mb-1 border border-gray-500 rounded-md cursor-grab"
        [cdkDragData]="item"
        cdkDrag
      />
    }
  </div>
</div>
