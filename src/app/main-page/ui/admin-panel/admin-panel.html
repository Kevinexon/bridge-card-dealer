<div class="p-4 rounded-2xl max-w-132" [class]="isPanelHidden() ? '' : 'shadow-sm bg-gray-100'">
  <div class="text-2xl flex justify-between">
    <div><span class="text-xl" [class.hidden]="isPanelHidden()">Admin panel</span></div>
    <button matIconButton (click)="changePanelVisibility()">
      <mat-icon>menu</mat-icon>
    </button>
  </div>

  <div [class.hidden]="isPanelHidden()">
    <mat-tab-group>
      <mat-tab label="Rozdanie" class="mat-elevation-z4">
        <section [class.hidden]="isPanelHidden()" class="pt-2">
          <div class="flex mt-2">
            <div class="flex-1">
              <mat-form-field appearance="outline">
                <mat-label>Numer rozdania</mat-label>
                <input matInput type="number" [(ngModel)]="number" />
              </mat-form-field>
            </div>

            <div class="flex-1 flex justify-center">
              <button matFab extended (click)="onDealNew.emit()">
                <mat-icon>refresh</mat-icon>
                Rozdaj ponownie
              </button>
            </div>
          </div>

          <div class="mt-2">
            <mat-slide-toggle [(ngModel)]="editMode" labelPosition="before">
              Tryb edycji rąk:</mat-slide-toggle
            >
          </div>

          <div class="mt-2">
            <span class="pr-2">Założenia (po parti):</span>
            <mat-button-toggle-group [(ngModel)]="linesVulnerable" multiple>
              <mat-button-toggle value="NS">NS</mat-button-toggle>
              <mat-button-toggle value="WE">WE</mat-button-toggle>
            </mat-button-toggle-group>
          </div>

          <div class="mt-2">
            <span class="pr-4">Dealer:</span>
            <mat-button-toggle-group [(ngModel)]="dealer" (valueChange)="onReset.emit()">
              <mat-button-toggle value="North" data-testid="dealer-North">North</mat-button-toggle>
              <mat-button-toggle value="East" data-testid="dealer-East">East</mat-button-toggle>
              <mat-button-toggle value="South" data-testid="dealer-South">South</mat-button-toggle>
              <mat-button-toggle value="West" data-testid="dealer-West">West</mat-button-toggle>
            </mat-button-toggle-group>
          </div>
        </section>
      </mat-tab>

      <mat-tab label="Cofnij" class="mat-elevation-z4">
        <section [class.hidden]="isPanelHidden()" class="h-54">
          <p class="text-xl py-2">Licytacja</p>
          <div class="pb-4 pt-2">
            <button
              matButton="outlined"
              class="mx-1"
              data-testid="reset-bidding"
              (click)="resetBidding.emit()"
            >
              <mat-icon>undo</mat-icon>
              Cofnij licytacje
            </button>
            <button
              matButton="outlined"
              class="mx-1"
              data-testid="undo-bid"
              (click)="undoBid.emit()"
            >
              <mat-icon>keyboard_arrow_left</mat-icon>
              Cofnij odzywkę
            </button>
          </div>

          <mat-divider />

          <p class="text-xl py-2">Rozgrywka</p>
          <div>
            <button
              matButton="outlined"
              class="mx-1"
              data-testid="reset-play"
              (click)="resetPlayedCards.emit()"
            >
              <mat-icon>undo</mat-icon>
              Cofnij rogrywkę
            </button>

            <button
              matButton="outlined"
              class="mx-1"
              data-testid="undo-trick"
              (click)="undoTrick.emit()"
            >
              <mat-icon>keyboard_double_arrow_left</mat-icon>
              Cofnij lewę
            </button>

            <button
              matButton="outlined"
              class="mx-1"
              data-testid="undo-card"
              (click)="undoCard.emit()"
            >
              <mat-icon>keyboard_arrow_left</mat-icon>
              Cofnij kartę
            </button>
          </div>
        </section>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
